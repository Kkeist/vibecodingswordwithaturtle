<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5ecd9">
  <title>王八许愿池的宝剑——vibecoding 受害者的勇者之路</title>
  <meta name="description" content="一份给 vibecoding 创作者的学习地图，从「我想做一个东西」一路走到底层。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='5' y='48' font-size='30' transform='translate(0 66) scale(1 -1)'%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3Ctext x='15' y='54' font-size='44'%3E%F0%9F%90%A2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>王八许愿池的宝剑</h1>
      <p>vibecoding 受害者的勇者之路</p>
    </div>
    <button class="reset-btn" type="button">重新开始</button>
  </header>

  <main id="canvas-wrapper" role="main">
    <svg id="link-layer" aria-hidden="true">
      <defs>
        <!-- 直流箭头 marker：父只有 1 个子节点时，连线终点带这个箭头 -->
        <marker id="arrow-direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#c97b4a" opacity="0.7"/>
        </marker>
        <!-- 直流箭头：visited 后高亮 -->
        <marker id="arrow-direct-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#c97b4a"/>
        </marker>
      </defs>
    </svg>
    <div id="node-layer"></div>
  </main>

  <div id="card-root" aria-live="polite"></div>
  <div id="toast-container" aria-live="polite"></div>

  <!-- 全局搜索：浮动按钮 + 搜索卡片 + 跳转后右下浮按钮（上一个/下一个） -->
  <button class="search-toggle" type="button" aria-label="搜节点">
    <span class="search-toggle-icon" aria-hidden="true">🔍</span>
    <span class="search-toggle-text">搜节点</span>
  </button>
  <div class="search-card" hidden role="dialog" aria-label="搜节点">
    <div class="search-card-head">
      <span class="search-card-title">🔍 搜任何节点</span>
      <button class="search-card-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="search-card-input-row">
      <input class="search-input" type="text" placeholder="输节点名 / 概念 / 关键词..." aria-label="搜索关键词">
    </div>
    <div class="search-results" role="listbox"></div>
    <div class="search-results-empty" hidden>没找到——换个关键词试试</div>
    <div class="search-results-hint">边输边搜全部 92 个节点。点结果直接跳过去。</div>
  </div>
  <div class="search-nav" hidden>
    <button class="search-nav-prev" type="button" aria-label="上一个结果">‹</button>
    <span class="search-nav-info">1 / 1</span>
    <button class="search-nav-next" type="button" aria-label="下一个结果">›</button>
    <button class="search-nav-close" type="button" aria-label="收起结果导航">×</button>
  </div>

  <aside class="notebook" aria-label="笔记本">
    <button class="notebook-toggle" type="button" aria-expanded="false">
      <span class="notebook-icon" aria-hidden="true">📓</span>
      <span class="notebook-label">笔记本</span>
      <span class="notebook-count empty" aria-label="收集到的概念数">0</span>
    </button>
    <div class="notebook-panel" role="region">
      <header class="notebook-head">
        <h2>笔记本</h2>
        <p>你一路点开圆圈，遇到的新概念会自动记在这里。</p>
      </header>
      <div class="notebook-search" style="display:none">
        <span class="notebook-search-icon" aria-hidden="true">🔍</span>
        <input class="notebook-search-input" type="text" placeholder="搜笔记里的字" aria-label="搜索笔记本">
        <button class="notebook-search-clear" type="button" aria-label="清空搜索" style="display:none">×</button>
      </div>
      <ul class="notebook-list">
        <li class="empty-hint">还没收集任何概念。<br>点开下方的圆圈开始走吧。</li>
      </ul>
    </div>
  </aside>

  <script src="data.js"></script>
  <script src="examples_inject.js"></script>
  <script src="app.js"></script>
</body>
</html>
